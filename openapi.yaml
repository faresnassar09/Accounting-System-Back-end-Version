                  nullable: true
                start_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:32'
                  nullable: true
                endDate:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:32'
                  nullable: true
                end_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:32'
                  nullable: true
