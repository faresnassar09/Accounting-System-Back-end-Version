openapi: 3.0.3
info:
  title: 'Accounting System API Documentation'
  description: 'Enterprise Multi-Tenant Double-Entry Accounting & ERP Engine API documentation.'
  version: 1.0.0
servers:
  -
    url: 'http://tenant1.localhost'
tags:
  -
    name: Endpoints
    description: ''
  -
    name: 'chart accounting'
    description: ''
  -
    name: 'financial year'
    description: ''
  -
    name: 'general ledger report'
    description: ''
  -
    name: 'income statement report'
    description: ''
  -
    name: 'journal entry'
    description: ''
  -
    name: 'opening journal entry'
    description: ''
  -
    name: 'trial balance report'
    description: ''
  -
    name: 'user auth'
    description: ''
  -
    name: 'user profile'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Send your OAuth2 token via the Authorization header: `Bearer {YOUR_TOKEN}`.'
security:
  -
    default: []
paths:
  /api/oauth/token:
    post:
      summary: 'Issue an access token.'
      operationId: issueAnAccessToken
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
  /api/v1/accounting/reports/balance-sheet:
    get:
      summary: ''
      operationId: getApiV1AccountingReportsBalanceSheet
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                endDate:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:32'
                  nullable: true
                end_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:32'
                  nullable: true
                export:
                  type: string
                  description: ''
                  example: pdf
                  enum:
                    - pdf
                    - excel
                  nullable: true
  /api/external/transaction/get:
    get:
      summary: ''
      operationId: getApiExternalTransactionGet
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:32'
                end_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:32'
                source_reference:
                  type: string
                  description: ''
                  example: architecto
  /api/external/transaction/create:
    post:
      summary: ''
      operationId: postApiExternalTransactionCreate
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timestamp:
                  type: string
                  description: ''
                  example: architecto
                description:
                  type: string
                  description: 'Must be at least 5 characters. Must not be greater than 255 characters.'
                  example: 'Et animi quos velit et fugiat.'
                total_amount:
                  type: string
                  description: 'Must be at least 1 character. Must not be greater than 999999999 characters.'
                  example: d
                parties:
                  type: object
                  description: ''
                  example: []
                  properties:
                    senders:
                      type: array
                      description: ''
                      example:
                        - []
                      items:
                        type: object
                        properties:
                          source_reference:
                            type: string
                            description: ''
                            example: architecto
                          amount:
                            type: string
                            description: ''
                            example: architecto
                        required:
                          - source_reference
                          - amount
                    receivers:
                      type: array
                      description: ''
                      example:
                        - []
                      items:
                        type: object
                        properties:
                          source_reference:
                            type: string
                            description: ''
                            example: architecto
                          amount:
                            type: string
                            description: ''
                            example: architecto
                        required:
                          - source_reference
                          - amount
              required:
                - timestamp
                - description
                - total_amount
  /api/external/reports/trial-balance:
