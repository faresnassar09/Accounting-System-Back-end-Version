      summary: 'user login'
      operationId: userLogin
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'user auth'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 50 characters.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: 'Must be at least 8 characters. Must not be greater than 32 characters.'
                  example: '+-0pBNvYgxwmi/#iw'
  /api/v1/profile:
    get:
