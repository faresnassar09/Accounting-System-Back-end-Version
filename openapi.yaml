  '/api/v1/accounting/financial-closing/preview/{year}':
    get:
      summary: 'retrieve revenues and expenses accounts'
      operationId: retrieveRevenuesAndExpensesAccounts
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'financial year'
    parameters:
      -
        in: path
        name: year
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/accounting/financial-closing/apply:
    post:
      summary: 'process clsing financial year'
      operationId: processClsingFinancialYear
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'financial year'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                year:
                  type: string
                  description: ''
                  example: architecto
                account_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
              required:
                - year
                - account_id
  /api/v1/accounting/reports/general-ledger:
    get:
      summary: 'Generate general ledger report'
      operationId: generateGeneralLedgerReport
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'general ledger report'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  description: 'This field is required when <code>account_id</code> is not present. Must match an existing stored value.'
                  example: null
                  nullable: true
                account_id:
                  type: string
                  description: 'This field is required when <code>accountId</code> is not present. Must match an existing stored value.'
                  example: null
                  nullable: true
                startDate:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:31'
                  nullable: true
                start_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:31'
                  nullable: true
                endDate:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:31'
                  nullable: true
                end_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-09-16T13:53:31'
                  nullable: true
                export:
                  type: string
                  description: ''
