  /api/v1/accounting/journal-entries:
    post:
      summary: 'store normal journal entry'
      operationId: storeNormalJournalEntry
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'journal entry'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                journalHeader:
                  type: object
                  description: ''
                  example: []
                  properties:
                    reference:
                      type: string
                      description: 'Must be at least 1 character. Must not be greater than 255 characters.'
                      example: b
                    date:
                      type: string
                      description: 'Must be a valid date.'
                      example: '2026-09-16T13:53:31'
                      nullable: true
                    description:
                      type: string
                      description: 'Must be at least 5 characters. Must not be greater than 255 characters.'
                      example: 'Et animi quos velit et fugiat.'
                    total_debit:
                      type: number
                      description: ''
                      example: 4326.41688
                    total_credit:
                      type: number
                      description: ''
                      example: 4326.41688
                  required:
                    - reference
                    - description
                    - total_debit
                    - total_credit
                lines:
                  type: array
                  description: ''
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      account_id:
                        type: string
                        description: 'Must match an existing stored value.'
                        example: architecto
                      debit:
                        type: number
                        description: 'This field is required when <code>lines.*.credit</code> is <code>0</code>. Must be at least 0. Must not be greater than 9999999999.'
                        example: 22
                      credit:
                        type: number
                        description: 'This field is required when <code>lines.*.debit</code> is <code>0</code>. Must be at least 0. Must not be greater than 9999999999.'
                        example: 7
                    required:
                      - account_id
  /api/v1/accounting/opening-balances:
    post:
