version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: accounting-app:latest
    container_name: accounting_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - DB_HOST=db
      - DB_DATABASE=accounting
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db
      - redis
    command: sh -c "php artisan migrate --force && php -S 0.0.0.0:8000 -t public"

  db:
    image: mysql:8
    container_name: accounting_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: accounting
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: accounting_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
